# PR 이 **공용 핵심 파일**을 건드리면 그 자리에서 알린다 (2026-11-17, C06 D-051).
#
# 왜 있나
#   2026-11-17 에 yesol 과 smilesy 가 서로 모르는 채 같은 화면을 각자 새로
#   만들다가 충돌 57개가 났다. 아무도 잘못하지 않았다 — **누가 뭘 건드리는지
#   서로 안 보였을 뿐이다.** 사람이 매번 공지하지 않아도 되게, 위험한 파일을
#   건드린 PR 에 자동으로 댓글을 단다.
#
# 막지 않는다. 검사를 떨어뜨리지도 않는다 — **보이게만 한다.**
# 진짜로 막는 것은 `전체 검사`(run-all) 와 `develop` 보호 규칙(C06 D-049)이다.
name: 공용 파일 알림

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: overlap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  warn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 건드린 공용 파일 찾기
        id: scan
        run: |
          base="origin/${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}" --depth=0 2>/dev/null || true
          changed="$(git diff --name-only "$base"...HEAD)"

          # ★ 화면 11개가 같이 쓰는 파일. 하나가 바뀌면 전부 영향을 받는다.
          core='^(src/assets/(ui|store|auth|net|i18n|login)\.js|src/assets/app\.css|src/sw\.js|src/index\.html|src/signup\.html)$'
          hit="$(printf '%s\n' "$changed" | grep -E "$core" || true)"

          {
            echo "hit<<EOF"
            printf '%s\n' "$hit"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 댓글 달기 (같은 댓글은 고쳐 쓴다)
        if: steps.scan.outputs.hit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HIT: ${{ steps.scan.outputs.hit }}
        run: |
          marker='<!-- overlap-warn -->'
          body="$(printf '%s\n\n### 공용 파일을 건드렸습니다\n\n아래 파일은 **화면 11개가 같이 씁니다.** 한 사람이 고치면 다른 화면이 같이 바뀝니다.\n\n```\n%s\n```\n\n한 번만 확인해 주세요.\n\n- 지우거나 이름을 바꾼 **요소 id · CSS class** 가 있나요? 다른 화면의 JS 가 그 이름을 찾고 있을 수 있습니다\n- 같은 파일을 다른 사람이 지금 고치고 있지 않나요? (`develop` 을 먼저 받아 오면 바로 보입니다)\n- `전체 검사`(run-all)가 통과했다면 **지금 있는 화면은 안전합니다** — 이 댓글은 막는 것이 아니라 알리는 것입니다\n\n<sub>자동 댓글 · `.github/workflows/overlap-warn.yml` · 규칙은 `.github/CODEOWNERS`</sub>' "$marker" "$HIT")"

          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
          echo "알렸습니다:"; printf '%s\n' "$HIT"
