# PR 마다 전체 회귀 검사를 돌린다 (T2 · TK-2-02 · 근거 A02 §10.3, C04 §4 DoD).
#
# 의존성 규칙 (C05 T-5′, 2026-10-31 T10 개정)
#   · `src/`(브라우저)는 의존성 0 — 여기에는 package.json 도 node_modules 도 없다
#   · 서버 `api/` 가 쓰는 드라이버 1개만 **저장소 루트** package.json 에 있다 → `npm ci`
#   · 검사 도구(jsdom)는 저장소 밖 임시 폴더에 버전을 고정해 깔고 NODE_PATH 로 가리킨다
#     (로컬에서 ~/jsdom-box 를 쓰는 것과 같은 방식이다 — CLAUDE.md 「회귀 검사」)

name: 전체 검사

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 서버 드라이버 1개. package-lock.json 그대로 깐다 (판이 바뀌면 안 된다).
      - name: 서버 의존성 설치 (루트, 드라이버 1개)
        run: npm ci --no-audit --no-fund

      # 버전을 박아 둔다. 시점에 따라 결과가 달라지면 안 된다 (D07 §4.2).
      - name: jsdom 설치 (저장소 밖)
        run: |
          mkdir -p "$RUNNER_TEMP/jsdom-box"
          cd "$RUNNER_TEMP/jsdom-box"
          npm init -y > /dev/null
          npm install --no-audit --no-fund jsdom@30.0.1

      - name: 전체 검사
        run: node tests/run-all.js
        env:
          NODE_PATH: ${{ runner.temp }}/jsdom-box/node_modules

      # 브라우저로 가는 src/ 는 여전히 의존성 0 이어야 한다 (C05 T-5′).
      # 검사가 추적 중인 파일을 건드려도 여기서 잡힌다.
      - name: src/ 가 의존성 0 인지 · 저장소가 그대로인지
        run: |
          test ! -e src/node_modules || { echo 'src/ 안에 node_modules 가 생겼다'; exit 1; }
          test ! -e src/package.json || { echo 'src/ 안에 package.json 이 생겼다'; exit 1; }
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
