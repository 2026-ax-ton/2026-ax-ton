<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이해도 검증 — 안전교육 이해도 검증 플랫폼</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/style-admin.css">
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="worker.css">
<script src="../assets/store.js"></script>
<script src="../assets/auth.js"></script>
<script src="../assets/i18n.js"></script>
<script>Auth.require('worker');</script>
</head>
<body class="has-tabbar">

<header class="workerbar apphead">
  <div class="who">
    <strong id="head-site"></strong>
    <span id="head-sub"></span>
  </div>
  <button class="btn-sm" type="button" id="btn-logout" data-i18n="action.logout">로그아웃</button>
</header>

<main class="page">

  <p class="blocked" id="blocked" hidden>
    이 브라우저에서는 저장소를 쓸 수 없습니다. 입력해도 새로고침하면 사라집니다.
  </p>

  <p class="voicenote" id="voicenote" hidden></p>

  <!-- ================================================================
       화면 A — 문항 진행
       ================================================================ -->
  <div id="view-quiz" class="quiz-stage" hidden>

    <p class="doing-now" id="quiz-course"></p>

    <div class="step-head">
      <span class="step-count" id="step-count"></span>
      <span class="step-dots" id="step-dots" aria-hidden="true"></span>
    </div>

    <div class="quiz-head">
      <span class="quiz-kind" id="quiz-kind" aria-hidden="true"></span>
      <p class="quiz-prompt" id="quiz-prompt"></p>
      <span id="prompt-audio"></span>
      <!-- 이 문항이 내 언어로 온전히 안 나올 때 "번역 준비 중" 배지가 들어오는 자리.
           번역이 없는 것을 조용히 숨기지 않는다 (기능3 과 같은 원칙). -->
      <div class="prompt-note" id="prompt-note" hidden></div>
    </div>

    <div id="quiz-body"></div>

    <!-- 결과 학습 — 맞고 틀림만 알려 주면 다음에 또 같은 선택을 한다.
         지금 이대로 하면 무슨 일이 생기는지 그 자리에서 말한다. -->
    <div class="consequence" id="consequence" hidden>
      <span class="pict" id="consequence-ico" aria-hidden="true">⚠</span>
      <p id="consequence-text"></p>
    </div>

    <div class="big-actions">
      <button class="btn btn-primary" type="button" id="btn-next" hidden><span data-i18n="quiz.nextQuestion">다음 문항</span><span aria-hidden="true"> ▶</span></button>
    </div>

  </div>

  <!-- ================================================================
       화면 B — 결과
       ================================================================ -->
  <div id="view-result" class="quiz-stage" hidden>

    <div class="result-panel" id="result-panel">
      <p class="pict" id="result-ico" aria-hidden="true"></p>
      <h2 id="result-title"></h2>
      <p class="score" id="result-score"></p>
      <p class="scorenote" id="result-note"></p>
    </div>

    <!-- 미통과 화면에서 가장 중요한 한 줄 (SCREEN 기능4) -->
    <p class="not-your-fault" id="result-fault" hidden></p>

    <ul class="result-review" id="result-review"></ul>

    <div class="big-actions" id="result-actions"></div>

  </div>

  <!-- ================================================================
       화면 C — 아직 검증할 수 없음 (교육을 먼저 들어야 한다)
       ================================================================ -->
  <div id="view-gate" class="quiz-stage" hidden>
    <section class="card">
      <p class="pict" id="gate-ico" aria-hidden="true"
         style="font-size:64px;text-align:center;margin:0">🎧</p>
      <h2 style="text-align:center" id="gate-title"></h2>
      <p class="muted" id="gate-why"></p>
      <div class="big-actions" id="gate-actions"></div>
    </section>
  </div>

</main>

<nav class="tabbar fixed" aria-label="메뉴">
  <a href="home.html"><span class="ico" aria-hidden="true">🏠</span><span data-i18n="nav.home">홈</span></a>
  <a href="learn.html"><span class="ico" aria-hidden="true">🎧</span><span data-i18n="nav.learn">교육</span></a>
  <a href="report.html"><span class="ico" aria-hidden="true">📷</span><span data-i18n="nav.report">신고</span></a>
  <a href="talk.html"><span class="ico" aria-hidden="true">💬</span><span data-i18n="nav.talk">소통</span></a>
  <a href="my.html"><span class="ico" aria-hidden="true">🙋</span><span data-i18n="nav.my">마이</span></a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="../assets/icons.js"></script>
<script src="../assets/ui.js"></script>
<script src="../assets/diagrams.js"></script>
<script src="quiz.js"></script>
</body>
</html>
