<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안전교육 수강 — 안전교육 이해도 검증 플랫폼</title>
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="../assets/style-admin.css">
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="worker.css">
<script src="../assets/store.js"></script>
<script src="../assets/auth.js"></script>
<script src="../assets/i18n.js"></script>
<script>Auth.require('worker');</script>
</head>
<body class="has-tabbar">

<header class="workerbar apphead">
  <div class="who">
    <strong id="head-site"></strong>
    <span id="head-sub"></span>
  </div>
  <button class="btn-sm" type="button" id="btn-logout" data-i18n="action.logout">로그아웃</button>
</header>

<main class="page">

  <p class="blocked" id="blocked" hidden>
    이 브라우저에서는 저장소를 쓸 수 없습니다. 입력해도 새로고침하면 사라집니다.
  </p>

  <p class="voicenote" id="voicenote" hidden></p>

  <!-- ================================================================
       화면 A — 내 교육 목록
       ================================================================ -->
  <div id="view-list">

    <div class="pagehead">
      <h1 data-i18n="learn.title">안전교육 수강</h1>
      <p class="lead" data-i18n="learn.lead">내 공정의 설비 교육을, 내 언어의 음성과 그림으로 듣습니다.</p>
    </div>

    <section class="card" aria-labelledby="t-courses">
      <div class="sec-head">
        <div>
          <h2 id="t-courses" data-i18n="home.myCourses">내 교육</h2>
          <p class="why" id="courses-why"></p>
        </div>
      </div>
      <ul class="course-list" id="course-list"></ul>
    </section>

  </div>

  <!-- ================================================================
       화면 B — 수강 진행. 안전 문구를 한 장씩 듣는다.
       ================================================================ -->
  <div id="view-step" class="learn-stage" hidden>

    <p class="doing-now" id="step-title"></p>

    <div class="step-head">
      <span class="step-count" id="step-count"></span>
      <span class="step-dots" id="step-dots" aria-hidden="true"></span>
    </div>

    <div class="phrase-card" id="phrase-card"></div>

    <div class="step-nav">
      <button class="btn btn-quiet" type="button" id="btn-prev"><span aria-hidden="true">◀ </span><span data-i18n="action.prev">이전</span></button>
      <button class="btn btn-primary wide" type="button" id="btn-next"><span data-i18n="action.next">다음</span><span aria-hidden="true"> ▶</span></button>
    </div>

    <div class="big-actions">
      <button class="btn btn-quiet" type="button" id="btn-quit"><span data-i18n="learn.backToList">교육 목록으로 돌아가기</span></button>
    </div>

  </div>

  <!-- ================================================================
       화면 C — 검수 완료된 문구가 없어서 진행할 수 없는 경우.

       검수 완료가 아닌 문구를 안전 지시로 쓰지 않는다는 규칙이
       여기서 화면으로 나타난다. 오역이 그대로 사고가 된다.
       ================================================================ -->
  <div id="view-nophrase" class="learn-stage" hidden>
    <section class="card">
      <p class="pict" style="font-size:64px;text-align:center;margin:0" aria-hidden="true">🚧</p>
      <h2 style="text-align:center" data-i18n="learn.notYet">아직 들을 수 없습니다</h2>
      <p class="muted" id="nophrase-why"></p>
      <div class="big-actions">
        <button class="btn btn-primary" type="button" id="btn-nophrase-back" data-i18n="learn.backToList">교육 목록으로 돌아가기</button>
      </div>
    </section>
  </div>

</main>

<nav class="tabbar fixed" aria-label="메뉴">
  <a href="home.html"><span class="ico" aria-hidden="true">🏠</span><span data-i18n="nav.home">홈</span></a>
  <a href="learn.html"><span class="ico" aria-hidden="true">🎧</span><span data-i18n="nav.learn">교육</span></a>
  <a href="report.html"><span class="ico" aria-hidden="true">📷</span><span data-i18n="nav.report">신고</span></a>
  <a href="talk.html"><span class="ico" aria-hidden="true">💬</span><span data-i18n="nav.talk">소통</span></a>
  <a href="my.html"><span class="ico" aria-hidden="true">🙋</span><span data-i18n="nav.my">마이</span></a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="../assets/icons.js"></script>
<script src="../assets/ui.js"></script>
<script src="learn.js"></script>
</body>
</html>
