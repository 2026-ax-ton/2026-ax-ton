<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — Safelang</title>
<meta name="description" content="Safelang — 역할에 따라 노동자 화면과 담당자·운영자 화면으로 갈라집니다.">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/style-admin.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="login-body">

<!-- 🆕 2026-11-15 로그인 화면을 시안(밝은 회색 바탕 + 가운데 흰 카드)으로 바꿨다.
     ★ 시안의 「보안 서버 정상 가동 중」「SSL 256-bit」 「법 제31조 준수 인증」 「1588-0000」은 넣지 않았다 —
       확인하지 않은 상태·인증·연락처를 화면에 쓰면 사실이 아닌 말이 된다. 이름은 전부 Safelang. -->
<header class="login-strip">
  <span class="login-strip-brand" data-brand="sm">safelang.</span>
</header>

<main class="login-main">

  <!-- 2026-11-16 사용자 결정 — 로그인 화면의 언어 선택을 뺐다. 노동자 언어는 로그인 뒤 계정의 언어로 바뀐다 -->

  <!-- QR 로 들어왔으면 로그인 뒤 어디로 가는지 미리 알린다 (H9 · FR-CM-01-09) -->
  <p class="qr-note" id="qr-note" hidden></p>

  <p class="blocked" id="blocked" hidden>
    이 브라우저에서는 저장소를 쓸 수 없습니다. 로그인 상태가 유지되지 않습니다.
    시크릿 모드이거나 사이트 데이터가 차단된 상태인지 확인해 주세요.
  </p>

  <section class="login-card" aria-labelledby="t-login">
    <div class="login-head">
      <span class="login-logo" data-brand="lg">safelang.</span>
      <span class="login-chip"><span class="ico" data-icon="person" aria-hidden="true"></span>노동자 · 담당자 · 운영자</span>
    </div>

    <h1 id="t-login">안전보건교육 관리시스템</h1>
    <p class="login-lead">사업장 안전교육 이해 확인과 교육 증빙 관리를 위해 로그인해 주세요.</p>

    <form id="form-login" autocomplete="off">
      <div class="field">
        <label for="login-id" data-i18n="login.id">아이디</label>
        <div class="login-input">
          <input id="login-id" type="text" placeholder="식별번호 또는 업무용 이메일" autocomplete="username">
          <span class="ico" data-icon="factory" aria-hidden="true"></span>
        </div>
      </div>
      <div class="field">
        <label for="login-pw" data-i18n="login.pw">비밀번호</label>
        <div class="login-input">
          <input id="login-pw" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
          <button class="login-eye" type="button" id="btn-pw-eye" aria-label="비밀번호 보기" aria-pressed="false"><span class="ico" data-icon="eye" aria-hidden="true"></span></button>
        </div>
      </div>

      <p class="loginerror" id="login-error" hidden></p>

      <!-- 지금 어느 길로 들어가는지 적는다. 색만으로 가르지 않는다 (C05 T-7) -->
      <p class="why" id="login-mode" hidden></p>

      <button class="btn btn-primary login-go" type="submit" id="btn-login">
        <span data-i18n="login.submit">로그인</span> <span aria-hidden="true">→</span>
      </button>
    </form>

    <hr class="hr">

    <a class="login-signup" href="signup.html">처음이세요? <b data-i18n="login.signupTitle">회원가입</b></a>
  </section>

  <p class="login-foot">Safelang © 2026</p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="assets/store.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/seed.js"></script>
<script src="assets/net.js"></script>
<script src="assets/login.js"></script>
</body>
</html>
